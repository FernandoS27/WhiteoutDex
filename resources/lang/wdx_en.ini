# WhiteoutDex UI translation overlay - English (authoritative source)
#
# The renderer window, the asset picker and the storage-browser primitives are
# WhiteoutFlakes' ImGui chrome hosted inside 3ds Max, so they read the
# submodule's `resources/lang/<code>.ini` catalogs. These files hold the few
# strings that are WhiteoutDex's own and have no counterpart upstream; the
# build concatenates each one onto the matching Flakes catalog to produce the
# `lang/<code>.ini` that ships, so a `wdx.*` key resolves through exactly the
# same tr() lookup as a `menu.*` one.
#
# Everything in the MaxScript UI is translated in
# src/pre_startup_scripts/WhiteoutDexLocalization.ms instead - this file is
# only for strings that live in C++.
#
# Format: key=value, UTF-8, no BOM. One string per line.
# Translation rules:
#   * Translate ONLY the value (right of '='); keep the key verbatim.
#   * Preserve every printf specifier exactly: %s %d etc.
#   * "\n" in a value becomes a line break; keep them where present.
#   * Technical tokens stay in English (CASC, MPQ, MDX, %TEMP% paths).

