# ---- Barra de herramientas del renderizador ----
wdx.toolbar.animation.free=Rango libre
wdx.toolbar.animation.tip=Indica en qué secuencia está el rango de animación de 3ds Max. Elige una secuencia para llevar el rango hasta ella; si cambias el rango en Max, esta lista lo sigue. «Rango libre» significa que el rango no coincide con ninguna secuencia: elígelo para abarcarlas todas.
wdx.toolbar.sync_camera=Sincronizar cámara
wdx.toolbar.sync_camera.tip=Sigue la vista activa de 3ds Max, incluso al cambiar de vista o mover la cámara. La órbita con el ratón queda desactivada en la vista previa mientras esté activo.
wdx.toolbar.resync=Resincronizar
wdx.toolbar.resync.tip=Vuelve a leer toda la escena: geometría, materiales, texturas, huesos, emisores, puntos de anclaje y formas de colisión.
