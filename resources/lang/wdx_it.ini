# ---- Barra degli strumenti del renderer ----
wdx.toolbar.animation.free=Intervallo libero
wdx.toolbar.animation.tip=Indica su quale sequenza si trova l'intervallo di animazione di 3ds Max. Scegli una sequenza per spostarvi l'intervallo; se cambi l'intervallo in Max, questo elenco lo segue. «Intervallo libero» significa che l'intervallo non corrisponde a nessuna sequenza: scegli questa voce per coprirle tutte.
wdx.toolbar.sync_camera=Sincronizza camera
wdx.toolbar.sync_camera.tip=Segue la vista attiva di 3ds Max, anche quando si cambia vista o si sposta la camera. L'orbita con il mouse è disattivata nell'anteprima mentre l'opzione è attiva.
wdx.toolbar.resync=Risincronizza
wdx.toolbar.resync.tip=Rilegge l'intera scena: geometria, materiali, texture, ossa, emettitori, punti di attacco e forme di collisione.
