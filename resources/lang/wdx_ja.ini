# ---- レンダラーのツールバー ----
wdx.toolbar.animation.free=フリー範囲
wdx.toolbar.animation.tip=3ds Max のアニメーション範囲がどのシーケンスにあるかを示します。シーケンスを選ぶと範囲がそこへ移動し、Max 側で範囲を変更するとこの表示が追従します。「フリー範囲」はどのシーケンスにも一致しない範囲で、選ぶとすべてのシーケンスを含む範囲になります。
wdx.toolbar.sync_camera=カメラを同期
wdx.toolbar.sync_camera.tip=アクティブな 3ds Max のビューポートに追従します。ビューポートを切り替えたりカメラを動かしたりしても同期は続きます。オンの間はプレビューでのマウス操作によるカメラ移動が無効になります。
wdx.toolbar.resync=再同期
wdx.toolbar.resync.tip=シーン全体を読み直します: ジオメトリ、マテリアル、テクスチャ、ボーン、エミッタ、アタッチメント ポイント、コリジョン形状。

# ---- レンダラーの表示メニュー ----
wdx.menu.art_tier.tip=プレビューがテクスチャ、エフェクト、昼夜リグを読み込む Warcraft III のオーバーレイです。「描画モードに従う」は SD モデルに Classic、HD モデルに Reforged を使います。Definitive は Definitive Edition のアートを最初に読み、次に Reforged、最後に Classic を読みます。変更するとシーンを再同期します。3ds Max のマテリアルに割り当て済みのビットマップには影響しません。
