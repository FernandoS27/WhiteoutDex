# ---- 렌더러 툴바 ----
wdx.toolbar.animation.free=자유 범위
wdx.toolbar.animation.tip=3ds Max의 애니메이션 범위가 어느 시퀀스에 있는지 보여줍니다. 시퀀스를 고르면 범위가 그쪽으로 옮겨가고, Max에서 범위를 바꾸면 이 목록이 따라갑니다. '자유 범위'는 어느 시퀀스와도 일치하지 않는 범위이며, 고르면 모든 시퀀스를 포함하는 범위가 됩니다.
wdx.toolbar.sync_camera=카메라 동기화
wdx.toolbar.sync_camera.tip=활성 3ds Max 뷰포트를 따라갑니다. 뷰포트를 전환하거나 카메라를 움직여도 계속 동기화됩니다. 켜져 있는 동안에는 미리보기에서 마우스로 카메라를 돌릴 수 없습니다.
wdx.toolbar.resync=다시 동기화
wdx.toolbar.resync.tip=장면 전체를 다시 읽습니다: 지오메트리, 머티리얼, 텍스처, 본, 이미터, 어태치먼트 포인트, 충돌 형상.
