# ---- Barre d'outils du moteur de rendu ----
wdx.toolbar.animation.free=Plage libre
wdx.toolbar.animation.tip=Indique sur quelle séquence se trouve la plage d'animation de 3ds Max. Choisissez une séquence pour y placer la plage ; si vous modifiez la plage dans Max, cette liste suit. « Plage libre » signifie que la plage ne correspond à aucune séquence : choisissez-la pour les couvrir toutes.
wdx.toolbar.sync_camera=Synchroniser la caméra
wdx.toolbar.sync_camera.tip=Suit la fenêtre active de 3ds Max, y compris lorsque vous changez de fenêtre ou déplacez la caméra. L'orbite à la souris est désactivée dans l'aperçu tant que l'option est active.
wdx.toolbar.resync=Resynchroniser
wdx.toolbar.resync.tip=Relit toute la scène : géométrie, matériaux, textures, os, émetteurs, points d'attache et formes de collision.

# ---- Menu Affichage du moteur de rendu ----
wdx.menu.art_tier.tip=La couche de Warcraft III dans laquelle l'aperçu lit les textures, les effets et le modèle jour/nuit. « Suivre le mode de rendu » utilise Classic pour les modèles SD et Reforged pour les modèles HD ; Definitive lit d'abord les graphismes de la Definitive Edition, puis Reforged, puis Classic. Le modifier resynchronise la scène. Les bitmaps déjà assignés dans les matériaux de 3ds Max ne sont pas concernés. Il est enregistré avec la scène, et « Graphismes de la scène » dans les réglages de WhiteoutDex modifie la même valeur.
