# ---- Панель инструментов рендерера ----
wdx.toolbar.animation.free=Свободный диапазон
wdx.toolbar.animation.tip=Показывает, на какой последовательности стоит диапазон анимации 3ds Max. Выберите последовательность, чтобы перевести диапазон на неё; если изменить диапазон в Max, список последует за ним. «Свободный диапазон» — это диапазон, не совпадающий ни с одной последовательностью: выберите его, чтобы охватить все.
wdx.toolbar.sync_camera=Синхронизировать камеру
wdx.toolbar.sync_camera.tip=Следует за активным окном проекции 3ds Max, в том числе при смене окна или перемещении камеры. Пока включено, управление камерой мышью в предпросмотре отключено.
wdx.toolbar.resync=Пересинхронизировать
wdx.toolbar.resync.tip=Заново считывает всю сцену: геометрию, материалы, текстуры, кости, эмиттеры, точки привязки и формы столкновений.

# ---- Меню «Вид» рендерера ----
wdx.menu.art_tier.tip=Из какого слоя Warcraft III предпросмотр читает текстуры, эффекты и модель смены дня и ночи. «Следовать режиму рендеринга» использует Classic для SD-моделей и Reforged для HD-моделей; Definitive сначала читает графику Definitive Edition, затем Reforged, затем Classic. Изменение пересинхронизирует сцену. Растровые изображения, уже назначенные в материалах 3ds Max, не затрагиваются. Сохраняется вместе со сценой; «Графика сцены» в окне настроек WhiteoutDex изменяет то же значение.
