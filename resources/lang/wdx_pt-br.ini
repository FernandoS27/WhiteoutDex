# ---- Barra de ferramentas do renderizador ----
wdx.toolbar.animation.free=Intervalo livre
wdx.toolbar.animation.tip=Mostra em qual sequência está o intervalo de animação do 3ds Max. Escolha uma sequência para levar o intervalo até ela; se você mudar o intervalo no Max, esta lista acompanha. “Intervalo livre” significa que o intervalo não corresponde a nenhuma sequência: escolha-o para abranger todas.
wdx.toolbar.sync_camera=Sincronizar câmera
wdx.toolbar.sync_camera.tip=Segue a viewport ativa do 3ds Max, inclusive ao trocar de viewport ou mover a câmera. A órbita com o mouse fica desativada na pré-visualização enquanto estiver ligado.
wdx.toolbar.resync=Ressincronizar
wdx.toolbar.resync.tip=Relê a cena inteira: geometria, materiais, texturas, ossos, emissores, pontos de anexo e formas de colisão.

# ---- Menu Exibir do renderizador ----
wdx.menu.art_tier.tip=De qual camada do Warcraft III a pré-visualização lê texturas, efeitos e o modelo de dia/noite. "Seguir o modo de renderização" usa Classic para modelos SD e Reforged para modelos HD; Definitive lê primeiro a arte da Definitive Edition, depois Reforged e por fim Classic. Alterar ressincroniza a cena. Bitmaps já atribuídos em materiais do 3ds Max não são afetados. É salvo com a cena, e “Arte da cena” nas configurações do WhiteoutDex edita o mesmo valor.
