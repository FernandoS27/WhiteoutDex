# ---- Renderer-Werkzeugleiste ----
wdx.toolbar.animation.free=Freier Bereich
wdx.toolbar.animation.tip=Zeigt, auf welcher Sequenz der Animationsbereich von 3ds Max liegt. Eine Sequenz auswählen, um den Bereich dorthin zu setzen; wird der Bereich in Max geändert, folgt diese Auswahl. „Freier Bereich“ bedeutet, dass der Bereich keiner einzelnen Sequenz entspricht – auswählen, um alle zu umfassen.
wdx.toolbar.sync_camera=Kamera synchronisieren
wdx.toolbar.sync_camera.tip=Folgt dem aktiven Ansichtsfenster von 3ds Max, auch beim Wechseln des Ansichtsfensters oder beim Bewegen der Kamera. Die Maussteuerung der Kamera ist in der Vorschau deaktiviert, solange dies aktiv ist.
wdx.toolbar.resync=Neu einlesen
wdx.toolbar.resync.tip=Liest die gesamte Szene neu ein: Geometrie, Materialien, Texturen, Knochen, Emitter, Anbindungspunkte und Kollisionsformen.
