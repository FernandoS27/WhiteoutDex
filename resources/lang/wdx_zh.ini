# ---- 渲染器工具栏 ----
wdx.toolbar.animation.free=自由范围
wdx.toolbar.animation.tip=显示 3ds Max 的动画范围当前位于哪个序列。选择一个序列即可把范围移到该序列；在 Max 中改动范围时，此列表也会跟随。“自由范围”表示当前范围不属于任何序列，选择它会把时间轴扩展到覆盖所有序列。
wdx.toolbar.sync_camera=同步摄影机
wdx.toolbar.sync_camera.tip=跟随 3ds Max 的活动视口，切换视口或移动摄影机时也保持同步。启用期间，预览窗口中的鼠标视角操作会被禁用。
wdx.toolbar.resync=重新同步
wdx.toolbar.resync.tip=重新读取整个场景：几何体、材质、贴图、骨骼、发射器、附着点和碰撞形状。

# ---- 渲染器视图菜单 ----
wdx.menu.art_tier.tip=预览从哪一层 Warcraft III 资源读取贴图、特效和昼夜光照模型。“跟随渲染模式”对 SD 模型使用 Classic，对 HD 模型使用 Reforged；Definitive 先读取 Definitive Edition 美术资源，然后是 Reforged，最后是 Classic。更改后会重新同步场景。已在 3ds Max 材质中指定的位图不受影响。
